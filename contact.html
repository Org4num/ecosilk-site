    FORM ACTION — placeholder.
    Same pattern as iDream: sign up free at formspree.io, create a form,
    drop the endpoint in below. No backend needed either way.
  -->
  <form class="contact-form" action="https://formspree.io/f/REPLACE_WITH_REAL_FORM_ID" method="POST">
    <input type="text" name="name" placeholder="Your name" required>
    <input type="email" name="email" placeholder="Your email" required>
    <textarea name="message" placeholder="What's on your mind?" required></textarea>
    <button type="submit" class="btn btn-full">Send</button>
  </form>
